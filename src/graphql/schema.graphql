scalar DateTime

enum LanguageCode {
  EN
  ES
}

enum SortOrder {
  ASC
  DESC
}

input BooleanFilter @oneOf {
  _eq: Boolean
  _neq: Boolean
}

input DateTimeFilter @oneOf {
  _eq: DateTime
  _neq: DateTime
  _gt: DateTime
  _lt: DateTime
  _gte: DateTime
  _lte: DateTime
}

input IDFilter {
  _eq: ID
  _neq: ID
  _gt: ID
  _lt: ID
  _gte: ID
  _lte: ID
  _containedBy: [ID!]
}

input IntFilter {
  _eq: Int
  _neq: Int
  _gt: Int
  _lt: Int
  _gte: Int
  _lte: Int
}

input StringFilter {
  _eq: String
  _neq: String
  _lt: String
  _gt: String
  _gte: String
  _lte: String
  _like: LikeOperatorValue
  _includes: String
  _includedBy: String
  _containedBy: [String!]
}

input LikeOperatorValue {
  _value: String!
  _ignoreCase: Boolean = false
}

input StringArrayFilter {
  _eq: [String!]
  _neq: [String!]
  _gt: [String!]
  _lt: [String!]
  _gte: [String!]
  _lte: [String!]
  _containsEl: String
  _containsArr: [String!]
  _containedBy: [String!]
  _overlaps: [String!]
}

type Partner {
  id: ID!
  partnerDetails(languageCode: LanguageCode!): PartnerDetails!
  locations(
    filter: LocationFilter
    orderBy: [LocationOrderByCriteria!]
    take: Int
  ): [Location!]!
  locationsCount(filter: LocationFilter): Int!
  rewards(
    filter: RewardFilter
    orderBy: [RewardOrderByCriteria!]
    take: Int
  ): [Reward!]!
  rewardsCount(filter: RewardFilter): Int!
}

type PartnerDetails {
  name: String!
  logoUrl: String!
  description: String!
  webAddressUrl: String
  webAddressText: String
  reasonForSupporting8by8: String
}

input PartnerFilter @oneOf {
  id: IDFilter
  partnerDetails: LocalizedPartnerDetailsFilter
  rewardsCount: RewardsCountFilter
  locationsCount: LocationsCountFilter
  _and: [PartnerFilter!]
  _or: [PartnerFilter!]
  _not: PartnerFilter
}

input LocalizedPartnerDetailsFilter {
  _languageCode: LanguageCode!
  _filter: PartnerDetailsFilter!
}

input PartnerDetailsFilter @oneOf {
  name: StringFilter
  logoUrl: StringFilter
  description: StringFilter
  webAddressUrl: StringFilter
  webAddressText: StringFilter
  reasonForSupporting8by8: StringFilter
  _and: [PartnerDetailsFilter!]
  _or: [PartnerDetailsFilter!]
  _not: PartnerDetailsFilter
}

input LocationsCountFilter {
  _value: IntFilter!
  _filter: LocationFilter
}

input RewardsCountFilter {
  _value: IntFilter!
  _filter: RewardFilter
}

input PartnerOrderByCriteria @oneOf {
  id: SortOrder
  partnerDetails: LocalizedPartnerDetailsOrderByCriteria
}

input LocalizedPartnerDetailsOrderByCriteria {
  _languageCode: LanguageCode!
  _orderBy: PartnerDetailsOrderByCriteria!
}

input PartnerDetailsOrderByCriteria @oneOf {
  name: SortOrder
  logoUrl: SortOrder
  description: SortOrder
  webAddressUrl: SortOrder
  webAddressText: SortOrder
  reasonForSupporting8by8: SortOrder
}

enum RedemptionForum {
  ONLINE
  IN_STORE
}

enum VoucherType {
  MULTIPLE_USE
  SINGLE_USE
  MANUAL
  ON_DEMAND
}

type Reward {
  id: ID!
  redemptionForums: [RedemptionForum!]!
  voucherType: VoucherType!
  hasLimitedTotalUsesOrQuantity: Boolean!
  vouchersRemaining: Int
  minExpirationDate: DateTime
  partner: Partner!
  rewardDetails(languageCode: LanguageCode): RewardDetails!
}

type RewardDetails {
  categories: [String!]!
  shortDescription: String!
  longDescription: String
}

input RewardFilter @oneOf {
  id: IDFilter
  redemptionForums: RedemptionForumArrayFilter
  voucherType: VoucherTypeFilter
  rewardDetails: LocalizedRewardDetailsFilter
  hasLimitedTotalUsesOrQuantity: BooleanFilter
  vouchersRemaining: IntFilter
  minExpirationDate: DateTimeFilter
  partner: PartnerFilter
  _and: [RewardFilter!]
  _or: [RewardFilter!]
  _not: RewardFilter
}

input RedemptionForumArrayFilter {
  _eq: [RedemptionForum!]
  _neq: [RedemptionForum!]
  _containsEl: RedemptionForum
  _containsArr: [RedemptionForum!]
  _containedBy: [RedemptionForum!]
  _overlaps: [RedemptionForum!]
}

input VoucherTypeFilter @oneOf {
  _eq: VoucherType
  _neq: VoucherType
  _containedBy: [VoucherType!]
}

input LocalizedRewardDetailsFilter {
  _languageCode: LanguageCode!
  _filter: RewardDetailsFilter!
}

input RewardDetailsFilter @oneOf {
  shortDescription: StringFilter
  longDescription: StringFilter
  categories: StringArrayFilter
  _and: [RewardDetailsFilter!]
  _or: [RewardDetailsFilter!]
  _not: RewardDetailsFilter
}

input RewardOrderByCriteria @oneOf {
  id: SortOrder
  vouchersRemaining: SortOrder
  minExpirationDate: SortOrder
  partner: PartnerOrderByCriteria
  rewardDetails: LocalizedRewardDetailsOrderByCriteria
}

input LocalizedRewardDetailsOrderByCriteria {
  _languageCode: LanguageCode!
  _orderBy: RewardDetailsOrderByCriteria!
}

input RewardDetailsOrderByCriteria @oneOf {
  categories: SortOrder
  shortDescription: SortOrder
  longDescription: SortOrder
}

enum DistanceUnits {
  METERS
  KILOMETERS
  MILES
}

type Location {
  id: ID!
  coordinates: Coordinates!
  distance(from: InputCoordinates!, units: DistanceUnits!): Float!
  partner: Partner!
}

type Coordinates {
  latitude: Float!
  longitude: Float!
}

input InputCoordinates {
  latitude: Float!
  longitude: Float!
}

input LocationFilter @oneOf {
  id: IDFilter
  distance: DistanceFilter
  partner: PartnerFilter
  _and: [LocationFilter!]
  _or: [LocationFilter!]
  _not: LocationFilter
}

input DistanceFilter @oneOf {
  _within: DistanceWithinFilter
}

input DistanceWithinFilter {
  _radius: Float!
  _from: InputCoordinates!
  _units: DistanceUnits!
}

input LocationOrderByCriteria @oneOf {
  id: SortOrder
  distance: DistanceOrderByCriteria
  partner: PartnerOrderByCriteria
}

input DistanceOrderByCriteria {
  _from: InputCoordinates!
  _sortOrder: SortOrder!
}

type Query {
  partner(id: ID!): Partner

  partners(
    filter: PartnerFilter
    orderBy: [PartnerOrderByCriteria!]
    take: Int = 50
  ): [Partner!]!

  partnersCount(filter: PartnerFilter): Int!

  location(id: ID!): Location

  locations(
    filter: LocationFilter
    orderBy: [LocationOrderByCriteria!]
    take: Int = 50
  ): [Location!]!

  locationsCount(filter: LocationFilter): Int!

  reward(id: ID!): Reward

  rewards(
    filter: RewardFilter
    orderBy: [RewardOrderByCriteria!]
    take: Int = 50
  ): [Reward!]!

  rewardsCount(filter: RewardFilter): Int!

  categories(languageCode: LanguageCode!): [String!]!
}
