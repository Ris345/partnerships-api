scalar DateTime

enum LanguageCode {
  EN
  ES
}

enum SortOrder {
  ASC
  DESC
}

input BooleanFilter @oneOf {
  _eq: Boolean
  _neq: Boolean
}

input DateTimeFilter @oneOf {
  _eq: DateTime
  _neq: DateTime
  _gt: DateTime
  _lt: DateTime
  _gte: DateTime
  _lte: DateTime
}

input IDFilter @oneOf {
  _eq: ID
  _neq: ID
  _gt: ID
  _lt: ID
  _gte: ID
  _lte: ID
  _containedBy: [ID!]
}

input IntFilter @oneOf {
  _eq: Int
  _neq: Int
  _gt: Int
  _lt: Int
  _gte: Int
  _lte: Int
}

input StringFilter @oneOf {
  _eq: String
  _neq: String
  _lt: String
  _gt: String
  _gte: String
  _lte: String
  _like: LikeOperatorValue
  _includes: String
  _includedBy: String
  _containedBy: [String!]
}

input LikeOperatorValue {
  _value: String!
  _ignoreCase: Boolean = false
}

input StringArrayFilter @oneOf {
  _eq: [String!]
  _neq: [String!]
  _gt: [String!]
  _lt: [String!]
  _gte: [String!]
  _lte: [String!]
  _containsEl: String
  _containsArr: [String!]
  _containedBy: [String!]
  _overlaps: [String!]
}

type Partner {
  id: ID!
  partnerDetails(languageCode: LanguageCode!): PartnerDetails!
  locations(
    filter: LocationFilter
    orderBy: [LocationOrderByCriteria!]
    take: Int
  ): [Location!]!
  locationsCount(filter: LocationFilter): Int!
  rewards(
    filter: RewardFilter
    orderBy: [RewardOrderByCriteria!]
    take: Int
  ): [Reward!]!
  rewardsCount(filter: RewardFilter): Int!
}

type PartnerDetails {
  name: String!
  logoUrl: String!
  description: String!
  webAddressUrl: String
  webAddressText: String
  reasonForSupporting8by8: String
}

input PartnerFilter @oneOf {
  id: IDFilter
  partnerDetails: TranslatedPartnerDetailsFilter
  rewardsCount: RewardsCountFilter
  locationsCount: LocationsCountFilter
  _and: [PartnerFilter!]
  _or: [PartnerFilter!]
  _not: PartnerFilter
}

input TranslatedPartnerDetailsFilter {
  _languageCode: LanguageCode!
  _filter: PartnerDetailsFilter!
}

input PartnerDetailsFilter @oneOf {
  name: StringFilter
  logoUrl: StringFilter
  description: StringFilter
  webAddressUrl: StringFilter
  webAddressText: StringFilter
  reasonForSupporting8by8: StringFilter
  _and: [PartnerDetailsFilter!]
  _or: [PartnerDetailsFilter!]
  _not: PartnerDetailsFilter
}

input LocationsCountFilter {
  _value: IntFilter!
  _filter: LocationFilter
}

input RewardsCountFilter {
  _value: IntFilter!
  _filter: RewardFilter
}

input PartnerOrderByCriteria @oneOf {
  id: SortOrder
  partnerDetails: TranslatedPartnerDetailsOrderByCriteria
}

input TranslatedPartnerDetailsOrderByCriteria {
  _languageCode: LanguageCode!
  _orderBy: PartnerDetailsOrderByCriteria!
}

input PartnerDetailsOrderByCriteria @oneOf {
  name: SortOrder
  logoUrl: SortOrder
  description: SortOrder
  webAddressUrl: SortOrder
  webAddressText: SortOrder
  reasonForSupporting8by8: SortOrder
}

enum DistanceUnits {
  KILOMETERS
  MILES
}

type Location {
  id: ID!
  coordinates: Coordinates!
  distance(from: InputCoordinates!, units: DistanceUnits!): Float!
  partner: Partner!
}

type Coordinates {
  latitude: Float!
  longitude: Float!
}

input InputCoordinates {
  latitude: Float!
  longitude: Float!
}

input LocationFilter @oneOf {
  id: IDFilter
  distance: DistanceFilter
  partner: PartnerFilter
  _and: [LocationFilter!]
  _or: [LocationFilter!]
  _not: LocationFilter
}

input DistanceFilter @oneOf {
  _within: DistanceWithinFilter
}

input DistanceWithinFilter {
  _radius: Float!
  _from: InputCoordinates!
  _units: DistanceUnits!
}

input LocationOrderByCriteria @oneOf {
  id: SortOrder
  distance: DistanceOrderByCriteria
  partner: PartnerOrderByCriteria
}

input DistanceOrderByCriteria {
  _from: InputCoordinates!
  _sortOrder: SortOrder!
}

enum RewardType {
  PUBLIC
  CLAIMABLE
}

enum RedemptionForum {
  ONLINE
  IN_STORE
}

interface IReward {
  id: ID!
  rewardType: RewardType!
  redemptionForums: [RedemptionForum!]!
  rewardDetails(languageCode: LanguageCode!): RewardDetails!
  partner: Partner!
}

union Reward = PublicReward | ClaimableReward

type PublicReward implements IReward {
  id: ID!
  rewardType: RewardType!
  redemptionForums: [RedemptionForum!]!
  partner: Partner!
  rewardDetails(languageCode: LanguageCode!): RewardDetails!
  publicVoucher: PublicVoucher!
}

type ClaimableReward implements IReward {
  id: ID!
  rewardType: RewardType!
  redemptionForums: [RedemptionForum!]!
  partner: Partner!
  rewardDetails(languageCode: LanguageCode!): RewardDetails!
  earliestExpirationDate: DateTime
}

type RewardDetails {
  categories: [String!]!
  shortDescription: String!
  longDescription: String
}

input RewardFilter @oneOf {
  id: IDFilter
  redemptionForums: RedemptionForumArrayFilter
  rewardDetails: TranslatedRewardDetailsFilter
  partner: PartnerFilter
  rewardType: RewardTypeFilter
  publicVoucher: TranslatedPublicVoucherFilter
  earliestExpirationDate: DateTimeFilter
  _and: [RewardFilter!]
  _or: [RewardFilter!]
  _not: RewardFilter
}

input RedemptionForumArrayFilter @oneOf {
  _eq: [RedemptionForum!]
  _neq: [RedemptionForum!]
  _containsEl: RedemptionForum
  _containsArr: [RedemptionForum!]
  _containedBy: [RedemptionForum!]
  _overlaps: [RedemptionForum!]
}

input TranslatedRewardDetailsFilter {
  _languageCode: LanguageCode!
  _filter: RewardDetailsFilter!
}

input RewardDetailsFilter @oneOf {
  shortDescription: StringFilter
  longDescription: StringFilter
  categories: StringArrayFilter
  _and: [RewardDetailsFilter!]
  _or: [RewardDetailsFilter!]
  _not: RewardDetailsFilter
}

input RewardTypeFilter @oneOf {
  _eq: RewardType
  _neq: RewardType
}

input TranslatedPublicVoucherFilter {
  _languageCode: LanguageCode!
  _filter: PublicVoucherFilter!
}

input PublicVoucherFilter @oneOf {
  hasLimitedTotalUses: BooleanFilter
  expirationDate: DateTimeFilter
}

input RewardOrderByCriteria @oneOf {
  id: SortOrder
  partner: PartnerOrderByCriteria
  rewardDetails: TranslatedRewardDetailsOrderByCriteria
}

input TranslatedRewardDetailsOrderByCriteria {
  _languageCode: LanguageCode!
  _orderBy: RewardDetailsOrderByCriteria!
}

input RewardDetailsOrderByCriteria @oneOf {
  categories: SortOrder
  shortDescription: SortOrder
  longDescription: SortOrder
}

enum RedemptionMethod {
  CODE
  QR_CODE
  LINK
  MANUAL
}

interface IVoucherDetails {
  redemptionMethod: RedemptionMethod!
  instructions: String!
}

type PublicVoucher {
  voucherDetails(languageCode: LanguageCode!): [VoucherDetails!]!
  hasLimitedTotalUses: Boolean!
  expirationDate: DateTime
}

type ClaimedVoucher {
  voucherDetailsTranslations: [TranslatedVoucherDetails!]!
  expirationDate: DateTime
}

type TranslatedVoucherDetails {
  languageCode: LanguageCode!
  voucherDetails: [VoucherDetails!]!
}

union VoucherDetails =
  | CodeVoucherDetails
  | QRCodeVoucherDetails
  | LinkVoucherDetails
  | ManualVoucherDetails

type CodeVoucherDetails implements IVoucherDetails {
  redemptionMethod: RedemptionMethod!
  instructions: String!
  redemptionCode: String!
}

type QRCodeVoucherDetails implements IVoucherDetails {
  redemptionMethod: RedemptionMethod!
  instructions: String!
  redemptionQRCode: String!
}

type LinkVoucherDetails implements IVoucherDetails {
  redemptionMethod: RedemptionMethod!
  instructions: String!
  redemptionLinkUrl: String!
  redemptionLinkText: String
}

type ManualVoucherDetails implements IVoucherDetails {
  redemptionMethod: RedemptionMethod!
  instructions: String!
}

type Query {
  partner(id: ID!): Partner

  partners(
    filter: PartnerFilter
    orderBy: [PartnerOrderByCriteria!]
    take: Int = 50
  ): [Partner!]!

  partnersCount(filter: PartnerFilter): Int!

  location(id: ID!): Location

  locations(
    filter: LocationFilter
    orderBy: [LocationOrderByCriteria!]
    take: Int = 50
  ): [Location!]!

  locationsCount(filter: LocationFilter): Int!

  reward(id: ID!): Reward

  rewards(
    filter: RewardFilter
    orderBy: [RewardOrderByCriteria!]
    take: Int = 50
  ): [Reward!]!

  rewardsCount(filter: RewardFilter): Int!

  categories(languageCode: LanguageCode!): [String!]!
}
