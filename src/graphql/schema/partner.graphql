type Partner {
  id: ID!
  translatedDetails(languageTag: String!): PartnerDetails!
  locations(
    filter: LocationFilter
    orderBy: [LocationOrderByCriteria!]
    take: Int
  ): [Location!]!
  locationCount(filter: LocationFilter): BigInt!
  rewards(
    filter: RewardFilter
    orderBy: [RewardOrderByCriteria!]
    take: Int
  ): [Reward!]!
  rewardCount(filter: RewardFilter): BigInt!
}

type PartnerDetails {
  name: String!
  logoUrl: String!
  description: String!
  webAddressUrl: String
  webAddressText: String
  motivation: String
}

input PartnerFilter @oneOf {
  id: IDFilter
  translatedDetails: TranslatedPartnerDetailsFilter
  rewardCount: RewardCountFilter
  locationCount: LocationCountFilter
  _and: [PartnerFilter!]
  _or: [PartnerFilter!]
  _not: PartnerFilter
}

input TranslatedPartnerDetailsFilter {
  _languageTag: String!
  _filter: PartnerDetailsFilter!
}

input PartnerDetailsFilter @oneOf {
  name: StringFilter
  logoUrl: StringFilter
  description: StringFilter
  motivation: StringFilter
  webAddressUrl: StringFilter
  webAddressText: StringFilter
  _and: [PartnerDetailsFilter!]
  _or: [PartnerDetailsFilter!]
  _not: PartnerDetailsFilter
}

input LocationCountFilter {
  _value: BigIntFilter!
  _filter: LocationFilter
}

input RewardCountFilter {
  _value: BigIntFilter!
  _filter: RewardFilter
}

input PartnerOrderByCriteria @oneOf {
  id: SortOptions
  translatedDetails: TranslatedPartnerDetailsOrderByCriteria
}

input TranslatedPartnerDetailsOrderByCriteria {
  _languageTag: String!
  _orderBy: PartnerDetailsOrderByCriteria!
}

input PartnerDetailsOrderByCriteria @oneOf {
  name: SortOptions
  logoUrl: SortOptions
  description: SortOptions
  webAddressUrl: SortOptions
  webAddressText: SortOptions
  motivation: SortOptions
}
